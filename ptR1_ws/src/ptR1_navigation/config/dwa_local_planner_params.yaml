DWAPlannerROS:
  # --- 1. Robot Configuration Parameters ---
  holonomic_robot: true # ถ้าเป็นล้อ Mecanum ให้เปิด true เพื่อให้สไลด์ข้างได้ (พริ้วกว่า)
  
  # ความเร็ว
  max_vel_x: 0.4
  min_vel_x: -0.1      
  
  max_vel_y: 0.2       # สไลด์ข้างได้นิดหน่อยเพื่อจัดระเบียบ
  min_vel_y: -0.2

  max_vel_trans: 0.5   # ความเร็วรวมไม่ควรเร็วเกินไปสำหรับการเดินในบ้าน/ออฟฟิศ
  min_vel_trans: 0.1

  max_vel_theta: 0.4   # หมุนไม่เร็วไม่ช้าเกินไป
  min_vel_theta: 0.2

  # --- 2. Acceleration Limits (ค่ามาตรฐานทั่วไป) ---
  acc_lim_x: 1.0       # เร่งตัวได้เร็วพอสมควร
  acc_lim_y: 1.0
  acc_lim_theta: 1.0   # เร่งหมุนได้ไว

  # --- 3. Forward Simulation Parameters ---
  sim_time: 1.3      # จำลองเส้นทางล่วงหน้า 1.3 วินาที 
  vx_samples: 10
  vy_samples: 5
  vtheta_samples: 20
  sim_granularity: 0.1 # ละเอียดขึ้นนิดนึงเพื่อความแม่น

  # --- 4. Trajectory Scoring Parameters (สูตรมาตรฐาน ROS) ---
  path_distance_bias: 32.0      # เกาะเส้น Global Path ระดับกลางๆ
  goal_distance_bias: 24.0      # พยายามเข้าหาเป้าหมาย
  occdist_scale: 0.02           # หลีกเลี่ยงสิ่งกีดขวางแบบนุ่มนวล
  forward_point_distance: 0.325 
  stop_time_buffer: 0.2
  scaling_speed: 0.25
  max_scaling_factor: 0.2
  heading_scoring: true
  heading_scoring_timestep: 0.8

  # --- 5. Oscillation Prevention ---
  oscillation_reset_dist: 0.05

  # --- 6. Goal Tolerance (สำคัญมากสำหรับความ "ปกติ") ---
  xy_goal_tolerance: 0.20       # ยอมรับความคลาดเคลื่อน 10cm
  yaw_goal_tolerance: 0.15      # ยอมรับความคลาดเคลื่อน 8.5 องศา
  latch_xy_goal_tolerance: true # เมื่อเข้าใกล้เป้าหมายแล้วจะล็อคไว้ไม่ให้หลุดง่ายๆ

  # --- 7. Debugging ---
  publish_cost_grid_pc: false
  publish_traj_pc: false         # แนะนำเปิด True ไว้ดูเส้นทางใน Rviz ว่าหุ่นคิดจะไปไหน